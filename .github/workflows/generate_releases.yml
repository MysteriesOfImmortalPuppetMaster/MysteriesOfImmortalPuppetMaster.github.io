name: Build and Release Books

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

# Runs one at a time, so two quick pushes can't both read the old download counts
# before either rewrites the release (that would count them twice or lose them).
concurrency:
  group: rolling-release
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ebooklib reportlab lxml

      - name: Run Build Script
        env:
            PYTHONUTF8: "1"
        run: |
          python build_epub.py

      # The rolling release is deleted and recreated on every build, which resets GitHub's
      # per-asset download counters. So before deleting it, add its current counts to the
      # running total carried in its notes (hidden "download-totals" comment), and write the
      # new total into the next release's notes.
      - name: Create or Overwrite Rolling Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body=""; cur_epub=0; cur_pdf=0
          if body=$(gh release view latest --json body --jq '.body' 2>err.txt); then
            cur_epub=$(gh release view latest --json assets --jq '[.assets[] | select(.name | endswith(".epub")) | .downloadCount] | add // 0')
            cur_pdf=$(gh release view latest --json assets --jq '[.assets[] | select(.name | endswith(".pdf")) | .downloadCount] | add // 0')
          elif grep -qi "not found" err.txt; then
            echo "No existing 'latest' release, starting totals from 0."
          else
            # Don't delete the release (and its counts) if we couldn't read it.
            cat err.txt; exit 1
          fi

          prev_epub=0; prev_pdf=0
          if [[ "$body" =~ download-totals\ epub=([0-9]+)\ pdf=([0-9]+) ]]; then
            prev_epub=${BASH_REMATCH[1]}; prev_pdf=${BASH_REMATCH[2]}
          fi
          export PREV_EPUB=$prev_epub PREV_PDF=$prev_pdf CUR_EPUB=$cur_epub CUR_PDF=$cur_pdf
          python .github/release_notes.py   # writes notes.md and the run summary
          cat notes.md

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest *.epub *.pdf --title "Latest Book Build" --notes-file notes.md
