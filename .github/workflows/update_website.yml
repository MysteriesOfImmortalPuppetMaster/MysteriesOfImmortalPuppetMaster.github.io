name: Update Website HTML

on:
  push:
    branches: [main]
    paths:
      - 'chapters/**'

jobs:
  update-html:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install beautifulsoup4 aiohttp

      - name: Run UpdateWebsite.py
        run: python UpdateWebsite.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-update: regenerate HTML from chapters"
          title: "🔄 Auto-update website HTML"
          body: |
            This PR was automatically generated after chapter files were modified.

            **Changes include:**
            - Updated `chapters.json`
            - Regenerated HTML files in `/read/`

            *Generated by the Update Website GitHub Action.*
          branch: auto-update-html
          delete-branch: true
          labels: automated
