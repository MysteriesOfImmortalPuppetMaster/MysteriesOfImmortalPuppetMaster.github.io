name: Update Website HTML

on:
  workflow_dispatch:

jobs:
  update-html:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install beautifulsoup4 aiohttp

      - name: Run UpdateWebsite.py
        run: python UpdateWebsite.py

      - name: Commit and push changes directly
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: regenerate HTML from chapters"
          branch: main
