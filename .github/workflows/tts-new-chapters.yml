# GitHub Actions: keep the audioStash repo in sync with the chapter texts.
#
# audioStash/tts_manifest.json records which version of each chapter's text its audio was
# made from. Every run renders the chapters that are new or changed (newest first) with
# Kokoro on a free CPU runner, as Opus 24 kbps .webm like the live site, committing each
# chapter as it finishes. The first chapter is pushed immediately (a new chapter is live
# ~15-25 min after its commit), then every 3 chapters. It stops starting new chapters
# before the 6 h job limit; whatever is left is picked up by the next run (the next push
# to chapters/, or the 6-hourly schedule). A new push cancels a running backlog run.
#
# Install (in MysteriesOfImmortalPuppetMaster.github.io):
#   1. Copy this file to   .github/workflows/tts-new-chapters.yml
#   2. Copy tts_book.py, text_prep.py, pinyin.py, ci_tts.py into   tts/
#   3. Secret AUDIOSTASH_TOKEN (site repo > Settings > Secrets and variables > Actions):
#      a token of MysteriesOfImmortalPuppetMaster with write access to audioStash
#      (fine-grained: only audioStash, Contents = Read and write; or classic: public_repo).
#   4. audioStash must contain tts_manifest.json (ci_tts.py --bootstrap), otherwise every
#      chapter counts as changed and the whole book gets re-rendered over many runs.
#
# Runs on every push that touches chapters/*.txt, tts/ or this file, every 6 h, or by hand
# (Actions tab > "TTS new chapters" > Run workflow; optionally list chapters to redo even
# if unchanged, e.g. "1045,1046" or "1040-1050").
# Speed on the runner: roughly 4x realtime, i.e. ~4 min per chapter, ~75 chapters per run.

name: TTS new chapters

on:
  push:
    branches: [main]
    # Chapter texts, plus the TTS setup itself (a run with nothing due ends in ~1 min).
    paths: ["chapters/*.txt", "tts/**", ".github/workflows/tts-new-chapters.yml"]
  schedule:
    - cron: "23 */6 * * *"   # drain any backlog; exits within ~1 min when nothing is due
  workflow_dispatch:
    inputs:
      chapters:
        description: 'Also redo these chapters even if unchanged, e.g. "1045,1046" or "1040-1050"'
        required: false

concurrency:
  # One run at a time, so pushes to audioStash never race. A newer run cancels the running
  # one: finished chapters are already pushed, and the new run renders the newest chapter
  # first, so a freshly pushed chapter never waits behind a long backlog run.
  group: tts-audiostash
  cancel-in-progress: true

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: MysteriesOfImmortalPuppetMaster/audioStash
          token: ${{ secrets.AUDIOSTASH_TOKEN }}   # needs write access to audioStash
          path: audioStash
          filter: blob:none            # don't download the existing ~3 GB of audio
          sparse-checkout: tts_manifest.json
          sparse-checkout-cone-mode: false

      - name: Check which chapters need audio
        id: plan
        env:
          FORCE: ${{ github.event.inputs.chapters }}
        run: |
          if [[ ! "$FORCE" =~ ^[0-9.,-]*$ ]]; then   # empty = nothing forced, which is fine
            echo "invalid chapter list: $FORCE"; exit 1
          fi
          python3 tts/ci_tts.py --chapters-dir chapters --stash audioStash --force "$FORCE" --plan

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.due != '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tts/tts_book.py

      - uses: actions/cache@v4
        if: steps.plan.outputs.due != '0'
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Install Kokoro (CPU) and ffmpeg
        if: steps.plan.outputs.due != '0'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro soundfile

      - name: Generate audio and push to audioStash
        if: steps.plan.outputs.due != '0'
        env:
          FORCE: ${{ github.event.inputs.chapters }}
        run: |
          git -C audioStash config user.name "MysteriesOfImmortalPuppetMaster"
          git -C audioStash config user.email "puppetinsanity.gov@gmail.com"
          # ~10 min of setup + 320 min budget + a last push stays under the 355 min timeout.
          python tts/ci_tts.py --chapters-dir chapters --stash audioStash --force "$FORCE" \
            --budget-minutes 320
