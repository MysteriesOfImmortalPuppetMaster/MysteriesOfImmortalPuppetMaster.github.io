# GitHub Actions: TTS added/changed chapters with Kokoro on a free CPU runner and push the
# audio (Opus 24 kbps .webm, same as the live site) into the audioStash repo.
#
# Install (in MysteriesOfImmortalPuppetMaster.github.io):
#   1. Copy this file to   .github/workflows/tts-new-chapters.yml
#   2. Copy tts_book.py, text_prep.py, pinyin.py into   tts/
#   3. Create a fine-grained token (github.com > Settings > Developer settings > Fine-grained
#      tokens) owned by MysteriesOfImmortalPuppetMaster, repository access: only audioStash,
#      permission "Contents: Read and write". Save it in the site repo as the Actions secret
#      AUDIOSTASH_TOKEN (Settings > Secrets and variables > Actions).
#
# Runs when chapters/*.txt are added or changed on main. To redo chapters by hand:
# Actions tab > "TTS new chapters" > Run workflow > e.g. "1045,1046" or "1040-1050".
# One chapter (~15 min of audio) takes ~6 min on the runner, plus ~2 min of setup.
# A job may run 6 h at most, so batches of more than ~50 chapters belong on the GPU.

name: TTS new chapters

on:
  push:
    branches: [main]
    paths: ["chapters/*.txt"]
  workflow_dispatch:
    inputs:
      chapters:
        description: 'Chapters to (re)generate, e.g. "1045,1046" or "1040-1050"'
        required: true

concurrency:
  group: tts-audiostash   # one run at a time, so pushes to audioStash never race
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find chapters to generate
        id: changed
        env:
          MANUAL: ${{ github.event.inputs.chapters }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$MANUAL" ]; then
            list="$MANUAL"
          else
            base="$BEFORE"
            if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base="HEAD~1"; fi
            list=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'chapters/*.txt' \
                   | sed -E 's#^chapters/(.*)\.txt$#\1#' | paste -sd, -)
          fi
          if ! printf '%s' "$list" | grep -Eq '^[0-9.,-]*$'; then
            echo "invalid chapter list: $list"; exit 1
          fi
          echo "chapters: ${list:-none}"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.list != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tts/tts_book.py

      - uses: actions/cache@v4
        if: steps.changed.outputs.list != ''
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Install Kokoro (CPU) and ffmpeg
        if: steps.changed.outputs.list != ''
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro soundfile

      - name: Generate audio
        if: steps.changed.outputs.list != ''
        env:
          LIST: ${{ steps.changed.outputs.list }}
        run: |
          python tts/tts_book.py full --engine kokoro --voice af_heart --format webm \
            --chapters "$LIST" --chapters-dir chapters --out out

      - uses: actions/checkout@v4
        if: steps.changed.outputs.list != ''
        with:
          repository: MysteriesOfImmortalPuppetMaster/audioStash
          token: ${{ secrets.AUDIOSTASH_TOKEN }}
          path: audioStash
          filter: blob:none            # don't download the existing ~3 GB of audio
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false

      - name: Push to audioStash
        if: steps.changed.outputs.list != ''
        env:
          LIST: ${{ steps.changed.outputs.list }}
        run: |
          cd audioStash
          git config user.name "MysteriesOfImmortalPuppetMaster"
          git config user.email "puppetinsanity.gov@gmail.com"
          for dir in ../out/*/; do
            ch=$(basename "$dir")
            git sparse-checkout add "/$ch/"
            rm -rf "$ch"
            cp -r "$dir" "$ch"
          done
          git add -A
          git commit -m "TTS chapters $LIST" || { echo "nothing to commit"; exit 0; }
          git push
